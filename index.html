<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 7 — Галерея</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f8f9fa;
        }

        .gallery-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .slider-viewport {
            width: 100%;
            overflow: hidden;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
        }

        .slider-track {
            display: flex;
            transition: transform 0.3s ease-in-out;
            width: 100%;
        }

        .slide {
            flex: 0 0 calc((100% - 20px) / 3);
            aspect-ratio: 16 / 9;
            background: #eee;
            margin-right: 10px;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 4px;
        }

        button {
            padding: 12px 16px;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 4px;
            user-select: none;
        }

        button:hover {
            background-color: #eee;
        }

        .pager {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #ccc;
            border-radius: 50%;
            cursor: pointer;
        }

        .dot.active {
            background: #333;
        }

        max-width: 768px {
            .slide {
                flex: 0 0 100%;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>

<div class="gallery-wrapper">
    <div class="slider-container">
        <button id="prevBtn">❮</button>
        <div class="slider-viewport" id="viewport">
            <div class="slider-track" id="track">
                <!-- Вставляй прямые ссылки на изображения прямо в теги img в коде -->
                <div class="slide"><img src="https://p.ohtuleht.ee/59/i/2025/5/2/ptdgnukp.1so.jpg" alt="1"></div>
                <div class="slide"><img src="https://static.seekingalpha.com/cdn/s3/uploads/getty_images/476219940/image_476219940.jpg?io=getty-c-w1080" alt="2"></div>
                <div class="slide"><img src="https://avatars.mds.yandex.net/i?id=13e180133173ede8acd7977b0a27e3b2_l-4599292-images-thumbs&n=13" alt="3"></div>
                <div class="slide"><img src="https://avatars.mds.yandex.net/i?id=eb427c01e5c47a08eb858938555afc1c_l-4119765-images-thumbs&n=13" alt="4"></div>
                <div class="slide"><img src="https://static.seekingalpha.com/cdn/s3/uploads/getty_images/1310405664/image_1310405664.jpg?io=getty-c-w1080" alt="5"></div>
                <div class="slide"><img src="https://avatars.mds.yandex.net/i?id=9a64d0a3643abedb0218597b62a5a221cd65855a-4146380-images-thumbs&n=13" alt="6"></div>
                <div class="slide"><img src="https://avatars.mds.yandex.net/i?id=5cffac405a15b9050ead15fe2c9ecba9_l-5233683-images-thumbs&n=13" alt="7"></div>
                <div class="slide"><img src="https://avatars.mds.yandex.net/i?id=729d0685d4679f70f324b65fecc0010220ed1e5a-4615575-images-thumbs&n=13" alt="8"></div>
            </div>
        </div>
        <button id="nextBtn">❯</button>
    </div>

    <div class="pager" id="pager"></div>
</div>

<script>
    const track = document.getElementById('track');
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pager = document.getElementById('pager');

    let currentIndex = 0;
    const totalSlides = slides.length;

    function getVisibleCount() {
        return window.innerWidth <= 768 ? 1 : 3;
    }

    function getMaxIndex() {
        return totalSlides - getVisibleCount();
    }

    function getSlideStepWidth() {
        const slide = slides[0];
        const style = window.getComputedStyle(slide);
        const marginRight = parseFloat(style.marginRight) || 0;
        return slide.getBoundingClientRect().width + marginRight;
    }

    function updatePager() {
        const maxIndex = getMaxIndex();
        if (currentIndex > maxIndex) currentIndex = maxIndex;

        pager.innerHTML = '';
        for (let i = 0; i <= maxIndex; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot' + (i === currentIndex ? ' active' : '');
            dot.addEventListener('click', () => {
                currentIndex = i;
                moveSlide();
            });
            pager.appendChild(dot);
        }
    }

    function moveSlide() {
        const maxIndex = getMaxIndex();
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex > maxIndex) currentIndex = maxIndex;

        const step = getSlideStepWidth();
        track.style.transform = `translateX(-${currentIndex * step}px)`;
        updatePager();
    }

    prevBtn.addEventListener('click', () => {
        currentIndex--;
        moveSlide();
    });

    nextBtn.addEventListener('click', () => {
        currentIndex++;
        moveSlide();
    });

    window.addEventListener('resize', () => {
        moveSlide();
    });

    moveSlide();
</script>

</body>
</html>
